source "${BASH_SOURCE%/*}/include/k3_common.inc"

declare -g LINUXFAMILY="k3-t3" # Separate kernel package from the regular `k3` family
declare -g ATFSOURCE="https://github.com/ARM-software/arm-trusted-firmware"

case "${BRANCH}" in

	vendor | vendor-rt)

		declare -g KERNELSOURCE="https://github.com/t3gemstone/linux" # T3 Foundation kernel
		declare -g KERNEL_MAJOR_MINOR="6.12"
		declare -g KERNELBRANCH="branch:v6.12.24-ti-arm64-r43-t3-gem-o1"
		declare -g KERNEL_DESCRIPTION="T3 Foundation (vendor) kernel"
		declare -g BOOTSOURCE="https://github.com/t3gemstone/u-boot" # T3 Foundation u-boot
		declare -g BOOTBRANCH="commit:b8410d78120ed91156f3ec7ede81bed004f8b46e"
		declare -g BOOTPATCHDIR="u-boot-t3-gem-o1"
		# The three firmware components below are pinned to what meta-ti
		# 5258ee2f (the revision t3gemstone/sdk builds against) uses, so the
		# SYSFW/DM ABI the vendor kernel expects matches what tiboot3.bin ships.
		#   trusted-firmware-a-ti.inc  SRCREV_tfa  e0c4d39 (v2.13.0-259)
		#   optee-os-ti-version.inc    SRCREV      a9690ae (4.7.0-47)
		#   ti-linux-fw.inc            SRCREV      8ec0c42 == tag 11.02.11
		declare -g ATFBRANCH="commit:e0c4d3903b382bf34f552af53e6d955fae5283ab"
		declare -g OPTEE_BRANCH="commit:a9690ae39995af36a31b7a4f446f27ea0787e3a4"
		declare -g TI_LINUX_FIRMWARE_BRANCH="tag:11.02.11"
		# artifact-uboot.sh does not otherwise hash TI_LINUX_FIRMWARE_BRANCH.
		# Fold it into the package version so an old tiboot3.bin cannot be
		# reused from Armbian's U-Boot artifact cache.
		declare -g UBOOT_HASH_EXTRA="ti-linux-firmware-11.02.11"
		EXTRAWIFI="no"
		;;

esac
